<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Bejelentkezés</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Sötét lila színátmenetes háttér */
            background: linear-gradient(135deg, #1a0033 0%, #0d001a 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Felső sáv (Fejléc) */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            box-sizing: border-box;
        }

        /* Bal felső logó és név (piros SEELMTA) */
        .top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-left img {
            width: 35px;
            height: auto;
        }
        .top-left span {
            color: #ff3333;
            font-size: 20px;
            font-weight: bold;
        }

        /* Jobb felső Vissza gomb */
        .top-right a {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.3s;
            border: 1px solid #444;
        }
        .top-right a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Bejelentkező kártya */
        .login-card {
            background-color: rgba(18, 18, 18, 0.85);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            width: 300px;
            text-align: center;
            border: 1px solid #333;
        }
        .login-card h2 {
            margin: 0;
            color: #ff3333;
        }
        .logo-container {
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 80px;
            height: auto;
            display: block;
            margin: 0 auto 10px auto;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background-color: #2c2c2c;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #ff3333;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <!-- Felső sáv -->
    <div class="top-bar">
        <div class="top-left">
            <img src="logo.png" alt="Logo">
            <span>SEELMTA</span>
        </div>
        <div class="top-right">
            <!-- Vissza a főoldalra -->
            <a href="index.html">Vissza fő oldalra</a>
        </div>
    </div>

    <!-- Bejelentkező doboz -->
    <div class="login-card">
        <div class="logo-container">
            <img src="logo.png" alt="SEELMTA Logo">
            <h2>SEELMTA</h2>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Felhasználónév</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label for="password">Jelszó</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="login-btn">Bejelentkezés</button>
        </form>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            alert('A rendszer készen áll a backend csatlakoztatására!');
        }
    </script>

</body>
</html>
