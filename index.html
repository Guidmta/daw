<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA - Bejelentkezés</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        .login-card img {
            width: 70px;
            height: auto;
            margin-bottom: 10px;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #ff3333;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #bbb;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .remember-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #bbb;
            text-align: left;
            cursor: pointer;
        }
        .remember-group input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #ff3333;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.png" alt="SEELMTA Logo">
        <h2>SEELMTA</h2>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Felhasználónév</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label for="password">Jelszó</label>
                <input type="password" id="password" required>
            </div>

            <!-- Adatok megjegyzése pipa -->
            <label class="remember-group">
                <input type="checkbox" id="rememberMe"> Adatok megjegyzése
            </label>

            <button type="submit" class="login-btn">Bejelentkezés</button>
        </form>
    </div>

    <script>
        // Kitöröljük a korábbi hibás elmentett "q"-t, hogy tiszta lappal induljon
        if (localStorage.getItem('seelmta_remembered_user') === 'q') {
            localStorage.removeItem('seelmta_remembered_user');
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('seelmta_remembered_user');
            if (savedUser) {
                document.getElementById('username').value = savedUser;
                document.getElementById('rememberMe').checked = true;
            }
        };

        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (rememberMe) {
                localStorage.setItem('seelmta_remembered_user', username);
            } else {
                localStorage.removeItem('seelmta_remembered_user');
            }

            localStorage.setItem('seelmta_user', username);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
