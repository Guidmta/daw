<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEELMTA.HU - Főoldal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Felső navigációs sáv */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        .nav-brand img {
            width: 30px;
            height: auto;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #c9d1d9;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* Fő tartalom */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero img {
            width: 80px;
            height: auto;
            margin-bottom: 15px;
        }

        .hero h1 {
            color: #2ea043;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #8b949e;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .cta-btn {
            background-color: #2ea043;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

        .cta-btn:hover {
            background-color: #238636;
        }
    </style>
</head>
<body>

    <!-- Felső sáv menüvel -->
    <div class="navbar">
        <div class="nav-brand">
            <img src="logo.png" alt="Logo">
            <span>SEELMTA.HU</span>
        </div>
        <div class="nav-links">
            <!-- Itt mutat az UCP gomb az ucp.html fájlra -->
            <a href="ucp.html">UCP</a>
            <a href="#">Segítség</a>
            <a href="#">Közösség</a>
            <a href="discord-szabalyzat">Discord Szabályzat</a>
            <a href="szabalyzat">Szerver Szabályzat</a>
        </div>
    </div>

    <!-- Főoldal közepe -->
    <div class="hero">
        <img src="logo.png" alt="SEELMTA Logo">
        <h1>SEELMTA</h1>
        <p>Kezdd el a saját RP Karaktered a SEELMTA szerverén, és alakítsd úgy a karaktered - ahogyan szeretnéd!</p>
        <a href="#" class="cta-btn">► Csatlakozz most</a>
    </div>

</body>
</html>
